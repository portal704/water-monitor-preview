<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Water Salinity Monitor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f0f;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{background:#1a1a2e;border-radius:24px;padding:34px 26px;text-align:center;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h1{font-size:1.1rem;color:#a0a0b0;font-weight:600}
.dot{width:140px;height:140px;border-radius:50%;margin:26px auto 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.8rem;font-weight:bold;transition:all .35s}
.dot.salty{background:#ff6d00;box-shadow:0 0 48px rgba(255,109,0,.45)}
.dot.fresh{background:#00c853;box-shadow:0 0 48px rgba(0,200,83,.45)}
.dot .lbl{font-size:.68rem;font-weight:400;opacity:.85;margin-top:5px;letter-spacing:.06em}
.stat{font-size:1.2rem;font-weight:700;margin-bottom:18px}
.stat.salty{color:#ff6d00}.stat.fresh{color:#00c853}
.badge{display:inline-block;font-size:.68rem;padding:4px 11px;border-radius:20px;font-weight:600;margin-bottom:14px}
.b-on{background:rgba(0,200,83,.15);color:#00c853;border:1px solid rgba(0,200,83,.35)}
.b-off{background:rgba(255,82,82,.15);color:#ff5252;border:1px solid rgba(255,82,82,.35)}
.b-demo{background:rgba(77,124,255,.15);color:#7ea3ff;border:1px solid rgba(77,124,255,.35)}
.kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #2a2a3a;font-size:.92rem}
.kv:last-of-type{border:0}
.kv .k{color:#8a8a95}.kv .v{font-weight:700}
.upd{color:#666;font-size:.74rem;margin-top:18px}
.tag{display:inline-block;font-size:.62rem;padding:3px 9px;border-radius:20px;background:#2c2c38;color:#8a8a95;letter-spacing:.06em;margin-top:8px}
.qr{margin-top:22px;padding-top:18px;border-top:1px solid #2a2a3a}
.qr h3{color:#8a8a95;font-size:.66rem;letter-spacing:.09em;margin-bottom:12px;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <h1>Water Salinity Monitor</h1>
  <div id="badge" class="badge b-demo">DEMO MODE</div>

  <div id="dot" class="dot fresh"><div>—</div><div class="lbl">WATER</div></div>
  <div id="stat" class="stat fresh">FRESH WATER</div>

  <div class="kv"><span class="k">TDS level</span><span class="v" id="tds">— ppm</span></div>
  <div class="kv"><span class="k">Pump</span><span class="v" id="pump">OFF</span></div>
  <div class="kv"><span class="k">Input</span><span class="v" id="src">simulated</span></div>

  <div id="upd" class="upd">waiting for data…</div>

  <div class="qr">
    <h3>SCAN TO SHARE</h3>
    <div id="qr"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

new QRCode($('qr'), {
  text: location.href, width: 116, height: 116,
  colorDark: '#000', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.M
});

async function poll() {
  try {
    const s = await (await fetch('/api/status', { cache: 'no-store' })).json();

    const live = s.online;

    $('badge').className = 'badge ' + (live ? 'b-on' : 'b-demo');
    $('badge').textContent = live ? '● live sensor' : 'DEMO MODE';

    $('dot').className = 'dot ' + (s.salty ? 'salty' : 'fresh');
    $('dot').innerHTML = '<div>' + (s.salty ? 'SALTY' : 'FRESH') + '</div><div class="lbl">WATER</div>';
    $('stat').className = 'stat ' + (s.salty ? 'salty' : 'fresh');
    $('stat').textContent = s.salty ? 'SALTY WATER' : 'FRESH WATER';

    $('tds').textContent = Math.round(s.tds) + ' ppm';
    $('pump').textContent = s.relay ? 'ON' : 'OFF';
    $('src').textContent = live ? 'sensor' : 'simulated';

    $('upd').textContent = live
      ? (s.uptime < 3 ? 'updated just now' : 'updated ' + s.uptime + 's ago')
      : 'reading driven from the admin panel';
  } catch (e) {
    $('badge').className = 'badge b-demo';
    $('badge').textContent = 'DEMO MODE';
  }
}

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
