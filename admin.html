<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Set Water Type</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f0f;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{background:#1a1a2e;border-radius:24px;padding:32px 24px;text-align:center;max-width:380px;width:100%}
h1{font-size:1.15rem;margin-bottom:6px}
p.sub{color:#8a8a95;font-size:.85rem;margin-bottom:26px}
.dot{width:120px;height:120px;border-radius:50%;margin:0 auto 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.5rem;font-weight:bold}
.dot.salty{background:#ff6d00;box-shadow:0 0 40px rgba(255,109,0,.45)}
.dot.fresh{background:#00c853;box-shadow:0 0 40px rgba(0,200,83,.45)}
.dot.live {background:#3a3a48;color:#8a8a95}
.dot .lbl{font-size:.62rem;font-weight:400;opacity:.85;margin-top:4px;letter-spacing:.06em}
button{width:100%;padding:20px;border:0;border-radius:14px;font-size:1.05rem;font-weight:800;cursor:pointer;color:#fff;transition:.15s}
button:active{transform:scale(.97)}
.b-salt{background:#ff6d00}
.b-fresh{background:#00c853;color:#000}
.b-live{background:#2c2c38;color:#c8c8d0;font-size:.9rem;font-weight:600;padding:14px}
.st{font-size:.82rem;color:#8a8a95;margin-top:20px;min-height:1.3em}
a{color:#4d7cff;text-decoration:none;font-size:.8rem;display:inline-block;margin-top:16px}
#gate{position:fixed;inset:0;background:rgba(8,8,12,.97);display:flex;align-items:center;justify-content:center;padding:24px;z-index:9}
#gate .box{max-width:300px;width:100%;text-align:center}
#gate input{width:100%;padding:14px;font-size:1.05rem;text-align:center;letter-spacing:.3em;border-radius:11px;border:1px solid #2e2e38;background:#17171c;color:#fff;margin:16px 0 6px}
#gate .msg{color:#ff5252;font-size:.85rem;min-height:1.2em;margin-top:10px}
#body{display:none}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h1>Admin</h1>
    <p class="sub" style="margin-bottom:0">Enter the password</p>
    <input id="pin" type="password" inputmode="numeric" placeholder="••••" autocomplete="current-password">
    <button class="b-fresh" onclick="unlock()" style="margin-top:8px">Unlock</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<div id="body">
<div class="card">
  <h1>Set Water Type</h1>
  <p class="sub">Shown on the public dashboard</p>

  <div id="dot" class="dot live"><div>LIVE</div><div class="lbl">SENSOR</div></div>

  <button class="b-salt"  onclick="setWater('salt')">SALT WATER</button>
  <div style="height:10px"></div>
  <button class="b-fresh" onclick="setWater('fresh')">FRESH WATER</button>
  <div style="height:10px"></div>
  <button class="b-live"  onclick="setWater('live')">Use live sensor</button>

  <div class="st" id="st">—</div>
  <a href="/">← Public dashboard</a>
  <div style="margin-top:10px"><a href="#" onclick="lock();return false">Lock</a></div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
let PASS = '';

function lock() {
  PASS = '';
  sessionStorage.removeItem('adm');
  $('body').style.display = 'none';
  $('gate').style.display = 'flex';
  $('pin').value = '';
}

async function unlock() {
  const v = $('pin').value;
  $('msg').textContent = '';
  $('msg').style.color = '#ff5252';

  let r;
  try {
    r = await fetch('/api/control', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Pass': v },
      body: JSON.stringify({})
    });
  } catch (e) {
    $('msg').textContent = 'Cannot reach server';
    return;
  }

  if (r.status === 401) { $('msg').textContent = 'Wrong password'; return; }

  PASS = v;
  sessionStorage.setItem('adm', v);
  $('gate').style.display = 'none';
  $('body').style.display = 'block';
  poll();
}

const LABEL = {
  salt:  ['SALTY', 'salty'],
  fresh: ['FRESH', 'fresh'],
  live:  ['LIVE',  'live']
};

async function setWater(w) {
  const r = await fetch('/api/control', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Admin-Pass': PASS },
    body: JSON.stringify({ water: w })
  }).catch(() => null);

  if (!r)  { $('st').textContent = 'Cannot reach server'; return; }
  if (r.status === 401) { $('st').textContent = 'Unauthorized'; return; }

  const s = await r.json();
  paint(s);
  $('st').textContent = 'Dashboard now shows: ' + LABEL[s.override][0];
}

function paint(s) {
  const [text, cls] = LABEL[s.override] || LABEL.live;
  $('dot').className = 'dot ' + cls;
  $('dot').innerHTML = '<div>' + text + '</div><div class="lbl">' +
                      (s.override === 'live' ? 'SENSOR' : 'OVERRIDE') + '</div>';
}

async function poll() {
  try {
    const s = await (await fetch('/api/status', { cache: 'no-store' })).json();
    paint(s);
  } catch (e) { /* keep last state */ }
}

// resume if already unlocked in this tab
if (sessionStorage.getItem('adm')) unlock();
else $('pin').focus();

poll();
setInterval(() => { if (PASS) poll(); }, 3000);
</script>
</body>
</html>
